# Ephemeral Immich, IPP and the upload service for the integration suites.
#
# Pinned on purpose. The point of running against a real Immich is to notice
# when Immich changes - which only works if the version is a deliberate choice
# you bump and watch, rather than whatever happened to be running.
#
# NO machine-learning container. Face detection and CLIP are irrelevant here,
# and the CUDA image is 4.5 GB. Thumbnails - which the gallery tests wait for -
# are generated by the server's microservices worker, not by ML.
#
# Layout, all on 127.0.0.1:
#   2283  Immich
#   3380  Traefik in front, as in production: /upload -> upload, else -> ipp
#   3381  IPP, direct
#   3382  upload service, direct (the request-level suite talks to it here)
#   3383  upload service allowing slug writes, with a tiny maxAssets
#   3384  upload service with aggressive slot bounds
#
#   docker compose -f test/immich-stack.yml up -d --build --wait
#   eval "$(./test/bootstrap.sh)"   # prints the export lines the suites need
#   docker compose -f test/immich-stack.yml down -v
name: ipp-test-stack

services:
  immich:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    environment:
      DB_HOSTNAME: db
      DB_USERNAME: postgres
      DB_PASSWORD: test
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      # Sets the default for a fresh database. Do NOT also set
      # IMMICH_WORKERS_INCLUDE=api: that would drop the microservices worker
      # that generates thumbnails, and the cache tests assert on those.
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
    volumes:
      - upload:/data
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'immich-healthcheck']
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 2s
      timeout: 5s
      retries: 30

  db:
    # Immich checks for a supported vector extension at startup and runs its
    # migrations unconditionally, so plain Postgres will not do even with ML
    # off. Note the tag: `pgvectors` here is pgvecto.rs, the legacy component,
    # not "pgvector 0.2.0" - three different extensions with similar names.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 2s
      timeout: 5s
      retries: 30

  ipp:
    # Built from the checkout, not pulled: the whole point is to test this
    # working tree against that Immich.
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      IMMICH_URL: http://immich:2283
      # The upload policy keys must match the upload service's, since IPP
      # applies the same policy to show the button. shareCacheTime is short so
      # the browser suite sees a new photo after a refresh, not two minutes on.
      CONFIG: >-
        {"ipp":{"showHomePage":false,"allowDownload":1,"shareCacheTime":2}}
    ports:
      - '127.0.0.1:3381:3000'
    depends_on:
      immich:
        condition: service_healthy
    healthcheck: &healthcheck
      test: ['CMD-SHELL', 'curl -sf -m 4 http://localhost:3000/healthcheck -o /dev/null || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  upload:
    build: &upload-build
      context: ..
      dockerfile: Dockerfile.upload
    environment:
      IMMICH_URL: http://immich:2283
      PUBLIC_BASE_URL: http://127.0.0.1:3380
      # maxFileSize must match E2E_UPLOAD_MAX_MB, or the size tests skip and
      # the run is quietly incomplete. rateLimit is off: the suites send more
      # than 60 files a minute to one share, and the limit has its own unit tests.
      CONFIG: >-
        {"ipp":{"upload":{"maxFileSize":2,"maxConcurrent":2,"rateLimit":0}}}
    ports:
      - '127.0.0.1:3382:3000'
    depends_on:
      immich:
        condition: service_healthy
    healthcheck: *healthcheck

  # Identical but for allowing writes through a slug link, with an album cap
  # of 3. requireRandomKey is on by default and should stay on, but with it
  # on the submitted key is always the canonical one - so the branch that
  # drops BOTH cached identities after an upload is unreachable, and a test
  # for it would pass without executing the code it claims to cover.
  upload-slug:
    build: *upload-build
    environment:
      IMMICH_URL: http://immich:2283
      CONFIG: >-
        {"ipp":{"upload":{"maxFileSize":2,"maxConcurrent":2,"rateLimit":0,
        "requireRandomKey":false,"maxAssets":3}}}
    ports:
      - '127.0.0.1:3383:3000'
    depends_on:
      immich:
        condition: service_healthy
    healthcheck: *healthcheck

  # Slots bounded aggressively, so the "a wedged connection gives its slot
  # back" test runs in seconds instead of the two minutes the default needs.
  # maxConcurrent 1, so one stalled socket exhausts the budget.
  upload-reap:
    build: *upload-build
    environment:
      IMMICH_URL: http://immich:2283
      CONFIG: >-
        {"ipp":{"upload":{"maxFileSize":2,"maxConcurrent":1,"rateLimit":0,
        "idleTimeoutSeconds":10,"maxDurationSeconds":60}}}
    ports:
      - '127.0.0.1:3384:3000'
    depends_on:
      immich:
        condition: service_healthy
    healthcheck: *healthcheck

  # The reverse proxy, as in production: one hostname, /upload to the upload
  # service with the path left in place, everything else to IPP.
  front:
    image: docker.io/library/traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=WARN
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - '127.0.0.1:3380:80'
    depends_on:
      ipp:
        condition: service_healthy
      upload:
        condition: service_healthy

volumes:
  upload:
