# Ephemeral Immich for the integration suites.
#
# Pinned on purpose. The point of running against a real Immich is to notice
# when Immich changes - which only works if the version is a deliberate choice
# you bump and watch, rather than whatever happened to be running.
#
# NO machine-learning container. Face detection and CLIP are irrelevant here,
# and the CUDA image is 4.5 GB. Thumbnails - which the cache-coherence tests
# do assert on - are generated by the server's microservices worker, not by
# ML. Upstream's own e2e compose omits ML the same way.
#
#   docker compose -f test/immich-stack.yml up -d --build
#   ./test/bootstrap.sh          # prints the export lines the suites need
#   docker compose -f test/immich-stack.yml down -v
name: ipp-test-stack

services:
  immich:
    image: ghcr.io/immich-app/immich-server:v3.2.2
    environment:
      DB_HOSTNAME: db
      DB_USERNAME: postgres
      DB_PASSWORD: test
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      # Sets the default for a fresh database. Do NOT also set
      # IMMICH_WORKERS_INCLUDE=api: that would drop the microservices worker
      # that generates thumbnails, and the cache tests assert on those.
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
    volumes:
      - upload:/data
    ports:
      - '127.0.0.1:2283:2283'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'immich-healthcheck']
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 2s
      timeout: 5s
      retries: 30

  db:
    # Immich checks for a supported vector extension at startup and runs its
    # migrations unconditionally, so plain Postgres will not do even with ML
    # off. Note the tag: `pgvectors` here is pgvecto.rs, the legacy component,
    # not "pgvector 0.2.0" - three different extensions with similar names.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 2s
      timeout: 5s
      retries: 30

  ipp:
    # Built from the checkout, not pulled: the whole point is to test the
    # proxy in this working tree against that Immich.
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      IMMICH_URL: http://immich:2283
      # maxFileSizeMb must match E2E_UPLOAD_MAX_MB, or the three size tests
      # skip and the run is quietly incomplete.
      CONFIG: >-
        {"ipp":{"showHomePage":false,"allowDownload":1,
        "upload":{"enabled":true,"maxFileSizeMb":2,"maxConcurrent":2}}}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      immich:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3000/share/healthcheck\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  upload:
